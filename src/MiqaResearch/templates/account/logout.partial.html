{% load i18n %}
<div class="app-modal-body etl-compact-modal">
    <div class="modal-header">
        <h2 id="app-modal-title" class="text-xl font-semibold">{% translate "Sign Out" %}</h2>
    </div>
    <p id="app-modal-description" class="text-sm text-muted-foreground">{% translate "Are you sure you want to sign out?" %}</p>
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <div class="modal-actions">
            <button type="submit" class="btn btn-primary">{% translate "Sign Out" %}</button>
            <button type="button" class="modal-cancel" data-modal-close>{% translate "Cancel" %}</button>
        </div>
    </form>
</div>
