<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      /* Hover animations */
      .glow-dot {
        opacity: 0;
      }

      svg:hover .glow-dot {
        opacity: 1;
      }

    </style>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8423D6FF" />
      <stop offset="100%" stop-color="#142A63FF" />
    </linearGradient>

    <radialGradient id="glow-gradient">
      <stop offset="0%" stop-color="#FFFFE0" /> <stop offset="50%" stop-color="#FFD700" /> <stop offset="100%" stop-color="rgba(255,193,7,0)" />
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#bg-gradient)" />

  <circle cx="38" cy="45" r="5" fill="#FFC107" />
  <circle cx="62" cy="55" r="5" fill="#FFC107" />

  <circle cx="25" cy="45" r="3.5" fill="#FFC107" />
  <circle cx="25" cy="25" r="3.5" fill="#FFC107" />
  <circle cx="50" cy="25" r="3.5" fill="#FFC107" />
  <circle cx="50" cy="75" r="3.5" fill="#FFC107" />
  <circle cx="75" cy="75" r="3.5" fill="#FFC107" />
  <circle cx="75" cy="55" r="3.5" fill="#FFC107" />

  <path d="M 38 45 L 25 45 L 25 25 L 50 25 L 50 75 L 75 75 L 75 55 L 62 55"
        fill="none" stroke="#FFC107" stroke-width="3"
        stroke-linejoin="round" />

  <circle class="glow-dot" r="4" fill="url(#glow-gradient)">
    <animateMotion dur="5s" repeatCount="indefinite"
                   path="M 38 45 L 25 45 L 25 25 L 50 25 L 50 75 L 75 75 L 75 55 L 62 55" />
  </circle>
</svg>
