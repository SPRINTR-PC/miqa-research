{% comment %}A Binding form's config fields (#238), re-fetched with the whole form whenever another Script Version is chosen: that Version's config schema decides which fields show, filled in with what was typed.{% endcomment %}
<div hx-get="{% url 'dashboard_tab_etl_binding_config_fields' project.id %}{% if binding %}?binding={{ binding.id }}{% endif %}"
  hx-trigger="change from:#{{ form.script_version.id_for_label }}" hx-include="closest form" hx-params="not csrfmiddlewaretoken" hx-target="this" hx-swap="innerHTML">
  {% include '01_dashboard/_etl_binding_config_fields.html' %}
</div>
