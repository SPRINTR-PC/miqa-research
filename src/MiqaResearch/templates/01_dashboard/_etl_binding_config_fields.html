{% for field in form.config_fields %}
<label class="etl-field"><span>{{ field.label }}</span>{{ field }}
  {% if field.help_text %}<span class="text-sm text-muted-foreground">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<p class="etl-form-error">{{ error }}</p>{% endfor %}
</label>
{% endfor %}
