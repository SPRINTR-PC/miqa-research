<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
    <defs>
        <style>
            .text-brand { fill: var(--text-brand, currentcolor); }
            .text-sub { fill: var(--text-fill, #64748b); }

            /* Hover Animations */
            .glow-dot {
              opacity: 0;
            }

            svg:hover .glow-dot {
              opacity: 1;
            }

            .logo-text {
                transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            }
            svg:hover .logo-text {
                transform: translateX(12px);
            }

            @keyframes dashFlow {
                to { stroke-dashoffset: -12; }
            }
        </style>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8423D6FF" />
      <stop offset="100%" stop-color="#142A63FF" />
        </linearGradient>

        <radialGradient id="glow-gradient">
          <stop offset="0%" stop-color="#FFFFE0" /> <stop offset="50%" stop-color="#FFD700" /> <stop offset="100%" stop-color="rgba(255,193,7,0)" />
        </radialGradient>
    </defs>
    <g transform="scale(3)">
        <circle cx="50" cy="50" r="50" fill="url(#bg-gradient)" />

        <circle cx="38" cy="45" r="5" fill="#FFC107" />
        <circle cx="62" cy="55" r="5" fill="#FFC107" />

        <circle cx="25" cy="45" r="3.5" fill="#FFC107" />
        <circle cx="25" cy="25" r="3.5" fill="#FFC107" />
        <circle cx="50" cy="25" r="3.5" fill="#FFC107" />
        <circle cx="50" cy="75" r="3.5" fill="#FFC107" />
        <circle cx="75" cy="75" r="3.5" fill="#FFC107" />
        <circle cx="75" cy="55" r="3.5" fill="#FFC107" />

        <path d="M 38 45 L 25 45 L 25 25 L 50 25 L 50 75 L 75 75 L 75 55 L 62 55"
              fill="none" stroke="#FFC107" stroke-width="3"
              stroke-linejoin="round" />

        <circle class="glow-dot" r="4" fill="url(#glow-gradient)">
          <animateMotion dur="5s" repeatCount="indefinite"
                         path="M 38 45 L 25 45 L 25 25 L 50 25 L 50 75 L 75 75 L 75 55 L 62 55" />
        </circle>
    </g>



    <!-- SEPARATOR -->
    <line x1="300" y1="80" x2="300" y2="220" stroke="rgba(50, 210, 151, 0.3)" stroke-width="2" stroke-linecap="round"></line>

    <!-- TYPOGRAPHY -->
    <g class="logo-text">
        <text x="340" y="155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="88" class="text-brand" text-anchor="start" letter-spacing="0.02em">MIQA</text>

        <text x="345" y="200" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="24" class="text-sub" text-anchor="start" letter-spacing="0.4em">RESEARCH</text>
    </g>
</svg>