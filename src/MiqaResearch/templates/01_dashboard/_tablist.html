{% get_current_language as LANGUAGE_CODE %}
<div id="dashboard-tablist" role="tablist" class="horizontal-tablist inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground"{% if oob %} hx-swap-oob="true"{% endif %}>
  <button type="button" role="tab" aria-selected="{% if active_tab == 'consent-statistics' %}true{% else %}false{% endif %}"
    hx-get="{% url 'dashboard_tab_consent_statistics' project.id %}" hx-target="#dashboard-tab-panel" hx-swap="innerHTML" hx-push-url="true" hx-sync="#dashboard-tab-panel:replace"
    hx-indicator="#dashboard-tab-loading, #dashboard-tab-panel"
    class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='database' icon_classes='text-primary' %}{% translate "Consent Statistics" %}</button>
  <button type="button" role="tab" aria-selected="{% if active_tab == 'goals' %}true{% else %}false{% endif %}"
    hx-get="{% url 'dashboard_tab_goals' project.id %}" hx-target="#dashboard-tab-panel" hx-swap="innerHTML" hx-push-url="true" hx-sync="#dashboard-tab-panel:replace"
    hx-indicator="#dashboard-tab-loading, #dashboard-tab-panel"
    class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='target' icon_classes='text-primary' %}{% translate "Goals" %}</button>
  <button type="button" role="tab" aria-selected="{% if active_tab == 'etl-pipelines' %}true{% else %}false{% endif %}"
    hx-get="{% url 'dashboard_tab_etl_pipelines' project.id %}" hx-target="#dashboard-tab-panel" hx-swap="innerHTML" hx-push-url="true" hx-sync="#dashboard-tab-panel:replace"
    hx-indicator="#dashboard-tab-loading, #dashboard-tab-panel"
    class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='scroll-text' icon_classes='text-primary' %}{% translate "ETL Pipelines" %}</button>
  <button type="button" role="tab" aria-selected="{% if active_tab == 'api-clients' %}true{% else %}false{% endif %}"
    hx-get="{% url 'dashboard_tab_api_clients' project.id %}" hx-target="#dashboard-tab-panel" hx-swap="innerHTML" hx-push-url="true" hx-sync="#dashboard-tab-panel:replace"
    hx-indicator="#dashboard-tab-loading, #dashboard-tab-panel"
    class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='shield-check' icon_classes='text-primary' %}{% translate "API Clients" %}</button>
</div>
