[project]
name = "miqa-research"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery-types>=0.26.0",
    "polars>=1.40.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "DJ", # flake8-django
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["MiqaResearch", "data", "documentation"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.MiqaResearch.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["MiqaResearch"]
addopts = "--reuse-db"
