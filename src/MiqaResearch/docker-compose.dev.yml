services:
  mires_web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py createcachetable && python manage.py runserver 0.0.0.0:8000"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SECRET_KEY=pf*3@8!@!8dtx%p)51_*sl*-5+fk)8ei^pq)j1$tcr$qm(j#q!
      - MIRES_DATABASE_URL=psql://postgres:postgres@mires_db:5432/miqaresearch
      - MIRES_SU_EMAIL=root@root.com
      - MIRES_SU_PASSWORD=root
      - MIRES_FRONTEND_URL=http://localhost:8000
      - MIRES_ALLOWED_HOSTS=*
      - MIRES_CACHE_BACKEND=django.core.cache.backends.db.DatabaseCache
      - MIRES_CACHE_LOCATION=miqa_research_cache
      - MIRES_EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - MIRES_CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://localhost:8080
      - MIRES_CELERY_BROKER_URL=amqp://guest:guest@miresrabbit:5672//
    depends_on:
      - mires_db
    ports:
      - "8080:8000"
    volumes:
      - .:/code
    networks:
      - mires
    restart: on-failure

  mires_db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=miqaresearch
    networks:
      - mires
    ports:
      - "5434:5432"
    restart: on-failure

  mires_fs:
    image: rustfs/rustfs:latest
    networks:
      - mires
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./LocalOnly/rustfs:/data
    restart: on-failure

  mires_worker_st1:
    build: .
    command: sh -c "/app/tools/celery/start_worker_st1.sh"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_CELERY_BROKER_URL=amqp://guest:guest@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - SET_CELERY_PYTHON_PATH=1
    depends_on:
      - mires_web
      - mires_rabbit
    volumes:
      - .:/app
    networks:
      - mires

  mires_flower:
    build: .
    command: sh -c "/app/tools/celery/start_flower.sh"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_CELERY_BROKER_URL=amqp://guest:guest@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - SET_CELERY_PYTHON_PATH=1
    depends_on:
      - mires_web
      - mires_rabbit
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    networks:
      - mires

  mires_rabbit:
    container_name: miresrabbit
    image: rabbitmq:4-management
    hostname: oqarabbit
    ports:
      - "5671:5672"
      - "15671:15672"
    networks:
      - mires

networks:
  mires: