[project]
name = "miqaresearch"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "django-environ>=0.13.0",
    "django-debug-toolbar",
    "django-htmx>=1.27.0",
    "django-oauth-toolkit",
    "django-allauth[mfa]>=65.16.1",
    "django-rosetta>=0.10.3",
    "psycopg[binary]>=3.3.3",
    "django-ninja",
    "hvac",
    "httpx",
    "pydicom",
    "celery>=5.6.3",
    "django-celery-beat>=2.9.0",
    "django-celery-results",
    "flower",
    "requests",
    "polars>=1.40.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-html-plus>=1.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "DJ", # flake8-django
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["MiqaResearch", "data", "documentation"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "MiqaResearch.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "--reuse-db"

[tool.pytest-html-plus.profiles.ci]
html-output = "tests/report/testresults"
json-report = "testresults.json"
capture-screenshots = "failed"
generate-xml = true
xml-report = "testresults.xml"