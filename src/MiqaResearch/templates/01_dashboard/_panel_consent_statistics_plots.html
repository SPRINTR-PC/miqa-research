<div class="rounded-lg border bg-card text-card-foreground shadow-sm p-6">
    <div class="flex items-center justify-between">
        <div>
            <h3 class="font-semibold text-lg">{% translate "Consented participants" %}</h3>
            <p class="text-sm text-muted-foreground">{% translate "Choose how the bar chart is grouped" %}</p>
        </div>
    </div>
    <div id="chart-switchable">
        <div class="chart-container">
            <mires-chart-bar class="card-plot" style="--chart-series-1: var(--color-primary)" data-url="{% url 'api-v1:dashboard_consent_statistics_plot' project.id %}"></mires-chart-bar>
        </div>
    </div>
</div>
<div class="rounded-lg border bg-card text-card-foreground shadow-sm p-6">
    <h3 class="font-semibold text-lg">{% translate "Cumulative consents over time" %}</h3>
    <p class="text-sm text-muted-foreground">{% translate "Cumulative consents, colored by site/clinic" %}</p>
    <div class="chart-container">
        <mires-chart-line class="card-plot" data-url="{% url 'api-v1:dashboard_consent_plot_by_clinic' project.id %}"
            webgl-threshold="50000"></mires-chart-line>
    </div>
</div>
