<div dir="ltr" data-orientation="horizontal">
  <div role="tablist" aria-orientation="horizontal" class="inline-flex h10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground mb-4">
  {% for tab in tabs %}
    <button type="button" role="tab" aria-selected="false" aria-controls="radix-:r2a:-content-dicom" data-state="inactive" id="radix-:r2a:-trigger-dicom" class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 gap-1.5" tabindex="{% if button.active %}0{% else %}-1{% endif %}" data-orientation="horizontal" data-radix-collection-item="">
      {% if button.icon_name %}{% include "components/icon.html" with icon_name=button.icon_name icon_classes="h3.5 w-3.5" %} {% endif %}{{ button.label }}
    </button>
  {% endfor %}
  </div>
</div>
