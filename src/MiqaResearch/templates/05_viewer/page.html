{% load static %}<!DOCTYPE html>
{# The viewer page (#279): standalone, full viewport, never extends base.html. Title is the alias only. #}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ open.participant.alias1 }}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    mires-viewer { display: block; height: 100vh; }
  </style>
</head>
<body>
{{ open.series|json_script:"viewer-series" }}
<mires-viewer wado-root="/api/v1/dicom" user="{{ request.user.pk }}" participant="{{ open.participant.pk }}" series-list="viewer-series" viewer-session="{{ viewer_session }}"{% if open.can_annotate %} can-annotate{% endif %}></mires-viewer>
<script src="{% static 'js/viewer/mireswc-viewer.js' %}" type="module"></script>
</body>
</html>
