services:
  mires_web:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "uv run --no-sync manage.py migrate && uv run --no-sync manage.py createcachetable && uv run --no-sync granian --interface asgi --host 0.0.0.0 --port 8000 --reload --reload-ignore-paths /app/LocalOnly MiqaResearch.asgi:application"
    environment:
      - MIRES_DEBUG=1
      - MIRES_LOGGING_LEVEL=DEBUG
      - MIRES_SECRET_KEY=pf*3@8!@!8dtx%p)51_*sl*-5+fk)8ei^pq)j1$tcr$qm(j#q!
      - MIRES_DATABASE_URL=psql://postgres:postgres@mires_db:5432/miqaresearch
      - MIRES_SU_EMAIL=root@root.com
      - MIRES_SU_PASSWORD=root
      - MIRES_FRONTEND_URL=http://localhost:8000
      - MIRES_ALLOWED_HOSTS=*
      - MIRES_CACHE_BACKEND=django.core.cache.backends.db.DatabaseCache
      - MIRES_CACHE_LOCATION=miqa_research_cache
      - MIRES_EMAIL_NOREPLY_SENDER_EMAIL=noreply@example.com
      - MIRES_EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - MIRES_CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://localhost:8080
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_USE_VAULT=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
      - MIRES_AUTHENTICATION_FRAMEWORK=adfs,local
      - MIRES_ADFS_AUTHORITY=https://adfs.test.umu.se
      - MIRES_OIDC_CLIENT_ID=1c3de344-d6d8-43b9-9b6c-61aa8ce33419
      - MIRES_ETL_S3_ENDPOINT_URL=http://miresfs:9000
    depends_on:
      - mires_db
      - mires_vault
    ports:
      - "8080:8000"
    networks:
      - mires
    volumes:
      - ./:/app
    restart: unless-stopped

  mires_db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=miqaresearch
    networks:
      - mires
    ports:
      - "5434:5432"
    restart: on-failure

  mires_fs:
    image: rustfs/rustfs:1.0.0
    # #171: underscore-containing hostnames fail a recent botocore's
    # is_valid_endpoint_url check, so boto3 clients must reach this
    # container as `miresfs`, not `mires_fs` -- same fix as mires_rabbit's
    # container_name/hostname: miresrabbit below.
    container_name: miresfs
    hostname: miresfs
    environment:
      - RUSTFS_ACCESS_KEY=MiresAccessKey
      - RUSTFS_SECRET_KEY=MiresSecretKey
      - RUSTFS_CONSOLE_ENABLED=true
      - RUSTFS_CONSOLE_PORT=9001
    networks:
      - mires
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: on-failure

  mires_fs_init:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: uv run --no-sync python tools/create_bucket.py
    environment:
      - S3_ENDPOINT_URL=http://miresfs:9000
      - S3_ACCESS_KEY=MiresAccessKey
      - S3_SECRET_KEY=MiresSecretKey
      - S3_BUCKET=mires-sftp
    volumes:
      - ./:/app
    networks:
      - mires
    depends_on:
      - mires_fs
    restart: "no"

  mires_sftpgo:
    image: drakkan/sftpgo:v2.7
    networks:
      - mires
    ports:
      - "2022:2022"
      - "8081:8080"     # web admin / REST API (8080 is taken by mires_web)
    environment:
      # DEFAULT_ADMIN_* is ignored unless create_default_admin is on
      - SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN=1
      - SFTPGO_DEFAULT_ADMIN_USERNAME=admin
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=admin
      - SFTPGO_LOADDATA_FROM=/etc/sftpgo-init/init.json
      # mode 1 = only add users that don't exist yet
      - SFTPGO_LOADDATA_MODE=1
    volumes:
      - ./tools/sftpgo/init.json:/etc/sftpgo-init/init.json:ro
      - mires_sftpgo_data:/var/lib/sftpgo   # SQLite db + host keys
    depends_on:
        - mires_fs
        - mires_fs_init
    restart: unless-stopped


  mires_vault:
    image: hashicorp/vault:latest
    container_name: mires_vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_DEV_ROOT_TOKEN_ID=AVeryUnsecretSecret
      - CONSENT_CLIENT_ID=replace-me-client-id
      - CONSENT_CLIENT_SECRET=replace-me-client-secret
      - FERNET_KEY=EiGdHopiKZdBZwVCP4dVJitPrrDnOuGAd94W4EZpwQc=
      - SENSITIVE_DATA_HASH_KEY=H2QCB14temR-C2JnLORSE5TxPwLd8iy3YygNPQ-corA=
      - ETL_S3_ACCESS_KEY_ID=MiresAccessKey
      - ETL_S3_SECRET_ACCESS_KEY=MiresSecretKey
    command: >
      sh -c "vault server -dev -dev-root-token-id=$$VAULT_DEV_ROOT_TOKEN_ID -dev-listen-address=0.0.0.0:8200 &
      until vault status >/dev/null 2>&1; do sleep 1; done;
      vault kv put secret/mires/consent ConsentClientId=$$CONSENT_CLIENT_ID ConsentClientSecret=$$CONSENT_CLIENT_SECRET;
      vault kv put secret/mires/datahashing FernetKey=$$FERNET_KEY SensitiveDataHashKey=$$SENSITIVE_DATA_HASH_KEY;
      vault kv put secret/mires/etl-s3 AccessKeyId=$$ETL_S3_ACCESS_KEY_ID SecretAccessKey=$$ETL_S3_SECRET_ACCESS_KEY;
      wait"
    networks:
      - mires
    ports:
      - "8200:8200"
    restart: on-failure

  mires_worker_consent:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "/tools/celery/start_worker.sh getConsents,calculateConsentStatistics"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - SET_CELERY_PYTHON_PATH=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
    depends_on:
      - mires_web
      - mires_rabbit
      - mires_vault
    volumes:
      - ./:/app
    networks:
      - mires
    restart: unless-stopped

  mires_worker_email:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "/tools/celery/start_worker.sh email"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - MIRES_TASK_CONSENT_SKIP_CLIENT=1
      - SET_CELERY_PYTHON_PATH=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
    depends_on:
      - mires_web
      - mires_rabbit
      - mires_vault
    volumes:
      - ./:/app
    networks:
      - mires
    restart: unless-stopped

  mires_worker_ocr:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "/tools/celery/start_worker.sh ocr"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - MIRES_TASK_CONSENT_SKIP_CLIENT=1
      - SET_CELERY_PYTHON_PATH=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
    depends_on:
      - mires_web
      - mires_rabbit
      - mires_vault
    volumes:
      - ./:/app
    networks:
      - mires
    restart: unless-stopped

  mires_worker_dicom:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "/tools/celery/start_worker.sh dicomIngestion"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      # test_miqaresearch, not miqaresearch: this worker exists only to serve
      # the dicom concurrency perf test (#126), which (via pytest-django)
      # runs against Django's test database, not the dev one -- a separate
      # database on the same server, so this must point at the same one the
      # test process does for the two to see each other's writes.
      - MIRES_DATABASE_URL=psql://postgres:postgres@mires_db:5432/test_miqaresearch
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - SET_CELERY_PYTHON_PATH=1
      # Unlike mires_worker_consent/email/ocr, this worker's task pseudonymizes
      # UIDs with Fernet encryption (helpers.dicom_uid.pseudonymize_uid), so it
      # actually needs a real FERNET_KEY -- found live: without MIRES_USE_VAULT,
      # FERNET_KEY is None and every file errors with "UID pseudonymization failed".
      - MIRES_USE_VAULT=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
      # Shared with mires_testrunner's dicom concurrency perf test (#126) --
      # source files that test writes must be readable inside this worker
      # container, since the task this worker runs executes *here*, not in
      # the test process. Storage stays on local disk (the default);
      # MIRES_MEDIA_ROOT points it at a scratch dir alongside the source
      # root, so the test can find and clean up its output (see its
      # docstring for why S3/RustFS isn't used here as an alternative).
      - MIRES_DICOM_ALLOWED_SOURCE_ROOTS=/app/.dev-data/dicom_perf_concurrency
      - MIRES_MEDIA_ROOT=/app/.dev-data/dicom_perf_concurrency_media
    depends_on:
      - mires_web
      - mires_db
      - mires_rabbit
      - mires_vault
    volumes:
      - ./:/app
    networks:
      - mires
    restart: unless-stopped

  mires_beat:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "/tools/celery/start_beat.sh"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_DATABASE_URL=psql://postgres:postgres@mires_db:5432/miqaresearch
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - MIRES_TASK_CONSENT_SKIP_CLIENT=1
      - SET_CELERY_PYTHON_PATH=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
    depends_on:
      - mires_web
      - mires_db
      - mires_rabbit
      - mires_vault
    volumes:
      - ./:/app
    networks:
      - mires
    restart: unless-stopped

  mires_flower:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: sh -c "/tools/celery/start_flower.sh"
    environment:
      - MIRES_DEBUG=1
      - MIRES_SITE_URL=http://mires_web:8000
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_AUTH_TOKEN=2ac83c66b6affe116e16efc51ef752f583b37c52
      - MIRES_TASK_CONSENT_SKIP_CLIENT=1
      - SET_CELERY_PYTHON_PATH=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
    depends_on:
      - mires_web
      - mires_rabbit
      - mires_vault
    ports:
      - "5555:5555"
    volumes:
      - ./:/app
    networks:
      - mires
    restart: unless-stopped

  mires_rabbit:
    container_name: miresrabbit
    image: rabbitmq:4.3-management
    hostname: miresrabbit
    environment:
      RABBITMQ_DEFAULT_USER: miresRabmin
      RABBITMQ_DEFAULT_PASS: miresRabmin
    ports:
      - "5671:5672"
      - "15671:15672"
    networks:
      - mires
    restart: unless-stopped

  mires_testrunner:
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: mires_testrunner
    environment:
      - MIRES_DEBUG=1
      - MIRES_SECRET_KEY=pf*3@8!@!8dtx%p)51_*sl*-5+fk)8ei^pq)j1$tcr$qm(j#q!
      - MIRES_DATABASE_URL=psql://postgres:postgres@mires_db:5432/miqaresearch
      - MIRES_ALLOWED_HOSTS=*
      - MIRES_CELERY_BROKER_URL=amqp://miresRabmin:miresRabmin@miresrabbit:5672//
      - MIRES_USE_VAULT=1
      - MIRES_VAULT_URL=http://mires_vault:8200
      - MIRES_VAULT_TOKEN=AVeryUnsecretSecret
    command: sh -c "pytest --plus-profile=ci"
    networks:
      - mires
    depends_on:
      - mires_rabbit
      - mires_db
      - mires_fs
      - mires_vault
      - mires_worker_dicom
    volumes:
      - ./:/app


  # ETL sandbox image (#161): built, not run, by the default `docker compose up` -- the
  # `etl-sandbox-build` profile keeps it out of the default stack. Build with
  # `docker compose --profile etl-sandbox-build build mires_etl_sandbox_python`, then point
  # MIRES_SANDBOX_IMAGE_ALLOWLIST at `mires-etl-sandbox-python:dev` for local dev/test.
  mires_etl_sandbox_python:
    build:
      context: .
      dockerfile: etl_sandbox.Dockerfile
    image: mires-etl-sandbox-python:dev
    profiles:
      - etl-sandbox-build

  # ETL sandbox R image (#166): FROM the Python sandbox image above, so build that one first --
  # `docker compose --profile etl-sandbox-build build mires_etl_sandbox_python mires_etl_sandbox_r`
  # -- then allowlist it as `"r-etl-v1": "mires-etl-sandbox-r:dev"`.
  mires_etl_sandbox_r:
    build:
      context: .
      dockerfile: etl_sandbox_r.Dockerfile
    image: mires-etl-sandbox-r:dev
    profiles:
      - etl-sandbox-build


networks:
  mires:

volumes:
  mires_vault_data:
  mires_sftpgo_data:
