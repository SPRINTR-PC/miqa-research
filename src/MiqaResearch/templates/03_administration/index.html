{% extends "base.html" %}
{% load static %}
{% get_current_language as LANGUAGE_CODE %}
{% block main %}
<div class="container space-y-4">
  <div>
    <div class="flex items-center gap-3">
      <h1 class="font-bold text-3xl tracking-tight">{% translate "Administration" %}</h1>
    </div>
    <p class="text-muted-foreground mt-1">{% translate "Manage users, research projects, and review audit logs." %}</p>
  </div>
  <div role="tablist" class="horizontal-tablist inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground">
    <button type="button" role="tab" aria-selected="true" class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='users' %}{% translate "Users" %}</button>
    <button type="button" role="tab" aria-selected="false" class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='folder-kanban' %}{% translate "Projects" %}</button>
    <button type="button" role="tab" aria-selected="false" class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='scroll-text' %}{% translate "Audit log" %}</button>
    <button type="button" role="tab" aria-selected="false" class="tab inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1_5 text-sm font-medium ring-offset-background ring-offset-2 ring-offset-background ring-1 ring-transparent hover:ring-primary gap-1">{% include 'components/icon.html' with icon_name='file-question' %}{% translate "Unmatched Data" %}</button>
  </div>
  <div id="admin-tab-panel"></div>
</div>
{%  endblock main %}
