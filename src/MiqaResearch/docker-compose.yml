services:
  mires_db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=miqaresearch
    networks:
      - mires
    ports:
      - "5434:5432"
    restart: on-failure

  mires_fs:
    image: rustfs/rustfs:latest
    networks:
      - mires
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./LocalOnly/rustfs:/data
    restart: on-failure

